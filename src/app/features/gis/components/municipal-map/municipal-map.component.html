<div #mapContainer class="municipal-map" role="application" aria-label="Municipal GIS map" (contextmenu)="onContextMenu($event)"></div>

<!-- Right-click menu -->
@if (contextMenu(); as menu) {
  <div class="map-ctx" role="menu" [style.left.px]="menu.x" [style.top.px]="menu.y" (contextmenu)="$event.preventDefault()">
    <div class="map-ctx__head">{{ menu.lonLat[1].toFixed(5) }}, {{ menu.lonLat[0].toFixed(5) }}</div>
    <button type="button" role="menuitem" class="map-ctx__item" (click)="openStreetView()">
      <i class="pi pi-camera" aria-hidden="true"></i> Street View here
    </button>
    <button type="button" role="menuitem" class="map-ctx__item" (click)="openGoogleStreetView()">
      <i class="pi pi-external-link" aria-hidden="true"></i> Open in Google Street View
    </button>
    <button type="button" role="menuitem" class="map-ctx__item" (click)="copyViewLink()">
      <i class="pi pi-link" aria-hidden="true"></i> Copy link to this view
    </button>
    <button type="button" role="menuitem" class="map-ctx__item" (click)="setHomeView()">
      <i class="pi pi-home" aria-hidden="true"></i> Set this view as my home view
    </button>
    @if (mapService.hasHomeView()) {
      <button type="button" role="menuitem" class="map-ctx__item" (click)="clearHomeView()">
        <i class="pi pi-times" aria-hidden="true"></i> Clear my home view
      </button>
    }
  </div>
}

<!-- Street View card opened from the right-click menu -->
@if (streetViewAt(); as at) {
  <div class="map-street">
    <app-street-view [at]="at" (closed)="closeStreetView()" />
  </div>
}

<!-- Identify popup — an OpenLayers Overlay; OL moves this element into its
     own overlay container and positions it at the clicked coordinate. -->
<div #featurePopup class="map-popup" [class.map-popup--hidden]="!popup() || docked()">
  @if (popup(); as state) {
    <button type="button" class="map-popup__dock" aria-label="Dock to the side" title="Dock to the side of the map" (click)="setDocked(true)">
      <i class="pi pi-window-maximize" aria-hidden="true"></i>
    </button>
    <button type="button" class="map-popup__close" aria-label="Close" (click)="closePopup()">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
    <div class="map-popup__body">
      <app-feature-info
        [loading]="state.loading"
        [error]="state.error"
        [results]="state.results"
      />
    </div>
  }
</div>

<!-- Docked Identify card: same contents, on the map's right edge. -->
@if (docked() && popup(); as state) {
  <section class="map-info" aria-label="Feature information">
    <header class="map-info__head">
      <span><i class="pi pi-info-circle" aria-hidden="true"></i> Feature info</span>
      <span class="map-info__actions">
        <button type="button" class="map-info__btn" aria-label="Show as popup at the point" title="Show as popup at the clicked point" (click)="setDocked(false)">
          <i class="pi pi-comment" aria-hidden="true"></i>
        </button>
        <button type="button" class="map-info__btn" aria-label="Close" title="Close" (click)="closePopup()">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </span>
    </header>
    <div class="map-info__body">
      <app-feature-info [loading]="state.loading" [error]="state.error" [results]="state.results" />
    </div>
  </section>
}
