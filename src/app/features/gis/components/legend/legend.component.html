@if (visibleLayers.length > 0) {
  <div class="legend" [class.legend--inline]="inline">
    @if (!inline) {
      <span class="eyebrow">Legend</span>
    }
    <ul class="legend__list">
      @for (layer of visibleLayers; track layer.id) {
        <li class="legend__item">
          <img
            [src]="legendUrl(layer)"
            [alt]="layer.name + ' legend'"
            class="legend__swatch"
            (error)="$any($event.target).hidden = true"
            (load)="$any($event.target).hidden = false"
          />
          <span>{{ layer.name }}</span>
        </li>
      }
    </ul>
  </div>
} @else if (inline) {
  <p class="legend__empty">Turn on a layer to see its legend.</p>
}
