services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: municipal-gis-keycloak
    # Development-only command: `start-dev` uses Keycloak's embedded H2
    # database and disables HTTPS enforcement so it can run locally without
    # extra infrastructure. Never use start-dev in production.
    command: start-dev --import-realm
    environment:
      # Dev-only bootstrap admin credentials for the Keycloak Admin Console
      # (http://localhost:8080). Not used by the Angular app and not a
      # production secret — change/remove before any real deployment.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      # Host port 8080 is commonly taken by other local services; Keycloak
      # itself still listens on 8080 inside the container.
      - "8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    restart: unless-stopped

  postgres:
    # Official PostGIS-enabled PostgreSQL image (postgis/postgis wraps the
    # same postgres:16 base and adds the PostGIS extension binaries). On a
    # brand-new volume its init scripts automatically run
    # `CREATE EXTENSION postgis` against POSTGRES_DB. Task 5's Prisma
    # migration also runs `CREATE EXTENSION IF NOT EXISTS postgis`
    # explicitly, so upgrading an EXISTING Task 3/4 database (whose volume
    # already has data, so these init scripts do NOT re-run) still enables
    # PostGIS correctly.
    # PostGIS + pgvector (RAG embeddings live in this same database). The
    # image extends the SAME alpine PostGIS base previously used, so the
    # existing postgres-data volume keeps working unchanged.
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: municipal-gis-postgres:16-3.4-pgvector
    container_name: municipal-gis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-municipal_gis}
      POSTGRES_USER: ${POSTGRES_USER:-municipal_gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-municipal_gis_dev_password}
    ports:
      # Host port 5432 is often already taken by a local Postgres install;
      # override POSTGRES_PORT in .env if so (container always listens on
      # 5432 internally).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-municipal_gis} -d ${POSTGRES_DB:-municipal_gis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  geoserver:
    # kartoza/geoserver is the standard, actively maintained open-source
    # Docker image for GeoServer local development — official GeoServer
    # ships no first-party image. Data dir is persisted in a named volume
    # so workspaces/datastores survive container restarts.
    image: kartoza/geoserver:2.25.2
    container_name: municipal-gis-geoserver
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      # Dev-only default password — change before any real deployment, and
      # never commit a real one. See docs/backend.md "GeoServer".
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver_dev_admin}
      INITIAL_MEMORY: 512M
      MAXIMUM_MEMORY: 1G
      # Angular (http://localhost:4200) calls GeoServer's anonymous OGC
      # endpoints directly from the browser. The WPS Execute POST sends
      # Content-Type: application/xml, which makes the browser fire a
      # CORS preflight — GeoServer must answer it. No credentials are
      # ever sent, so a wildcard origin is safe here (dev only).
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
      # YSLD styling (GIS Layer Styling — docs/backend.md). kartoza
      # downloads geoserver-2.25.2-ysld-plugin.zip on start (needs
      # internet, one-time ~few MB) so GeoServer can store/serve YSLD
      # styles the app authors.
      STABLE_EXTENSIONS: ${GEOSERVER_STABLE_EXTENSIONS:-ysld-plugin}
      FORCE_DOWNLOAD_STABLE_EXTENSIONS: "true"
    ports:
      # Host port 8080 is commonly taken; GeoServer listens on 8080
      # internally, serving under the /geoserver context path.
      - "${GEOSERVER_PORT:-8600}:8080"
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mapfish-print:
    # MapFish Print v3 — the map compositing / PDF+PNG engine behind the
    # GIS workspace's Print Layout tool. Only the backend talks to it (see
    # backend/src/gis/print.service.ts); it is never exposed to the browser.
    # It fetches WMS from GeoServer and basemap tiles over the compose
    # network + the public internet. Print templates live in
    # ./mapfish-print/print-apps/municipal-gis (config.yaml + *.jrxml).
    image: camptocamp/mapfish_print:3.30
    container_name: municipal-gis-mapfish-print
    environment:
      # ~1 GB of extra RAM for the print JVM. Lower Xmx if the stack is
      # tight, but large A3/300-dpi renders may then fail.
      CATALINA_OPTS: "-Xms256m -Xmx1g"
    # No published port (backend-only). To hit capabilities.json /
    # buildreport directly while debugging templates, add:
    #   ports: ["8680:8080"]
    volumes:
      - ./mapfish-print/print-apps:/usr/local/tomcat/webapps/ROOT/print-apps:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/print/municipal-gis/capabilities.json > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  ollama:
    # Self-hosted open-source LLM runtime. No API key, no external AI
    # service. First start downloads the model (see GIS_AI_LLM_MODEL); it is
    # cached in the ollama-models volume. CPU by default — to use an NVIDIA
    # GPU, add a `deploy.resources.reservations.devices` block and a driver
    # new enough for the image's CUDA.
    image: ollama/ollama:0.5.13
    container_name: municipal-gis-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # One request at a time — this is an internal single-user service, and
      # NUM_PARALLEL>1 multiplies the KV-cache / compute-buffer memory.
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama --version > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gis-ai:
    # Python AI/RAG backend for the natural-language GIS chatbot.
    # open-source LLM (Ollama) <- prompt templates <- RAG retrieval <-
    # pgvector <- local embedding model. Only the NestJS backend calls it;
    # never the browser.
    build:
      context: ./ai
    container_name: municipal-gis-ai
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-municipal_gis}:${POSTGRES_PASSWORD:-municipal_gis_dev_password}@postgres:5432/${POSTGRES_DB:-municipal_gis}
      OLLAMA_URL: http://ollama:11434
      # Open-source instruct model (Apache-2.0). 1.5b runs on ~8 GB RAM /
      # CPU; set GIS_AI_LLM_MODEL=qwen2.5:3b-instruct on a roomier host.
      GIS_AI_LLM_MODEL: ${GIS_AI_LLM_MODEL:-qwen2.5:1.5b-instruct}
      GIS_AI_LLM_NUM_CTX: ${GIS_AI_LLM_NUM_CTX:-6144}
    ports:
      - "${GIS_AI_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: municipal-gis-backend
    environment:
      # Natural-language GIS assistant — the Python AI service.
      GIS_AI_URL: http://gis-ai:8000
      # Dev/QA only: allow POST /api/gis/ai/execute-plan to run a structured
      # operation with no LLM (still fully validated + compiled). Off unless
      # explicitly set.
      GIS_AI_ENABLE_RAW_PLAN: ${GIS_AI_ENABLE_RAW_PLAN:-}
      # Reaches Postgres via the compose network, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-municipal_gis}:${POSTGRES_PASSWORD:-municipal_gis_dev_password}@postgres:5432/${POSTGRES_DB:-municipal_gis}?schema=public
      BACKEND_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      # KEYCLOAK_URL must be the SAME origin the browser/Angular uses (it is
      # baked into every token's `iss` claim, which the backend validates
      # against). KEYCLOAK_INTERNAL_URL is where this container actually
      # reaches Keycloak over the compose network — see
      # backend/src/auth/strategies/keycloak-jwt.strategy.ts for why these
      # two must be allowed to differ.
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-municipal-gis}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-municipal-gis-frontend}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-municipal-gis-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-dev-backend-client-secret-change-me}
      # GeoServer REST API — server-side only, never exposed to Angular.
      # Internal compose network address; not the browser-facing one (there
      # is no browser-facing GeoServer URL in this task — Angular only ever
      # talks to NestJS, see docs/backend.md "GeoServer").
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver_dev_admin}
      # Connection parameters GeoServer's PostGIS datastores are configured
      # with. Same physical database as DATABASE_URL above (see
      # docs/backend.md §19 — one shared PostGIS instance for now), passed
      # discretely rather than parsed out of DATABASE_URL for clarity.
      POSTGIS_HOST: postgres
      POSTGIS_PORT: "5432"
      POSTGIS_DATABASE: ${POSTGRES_DB:-municipal_gis}
      POSTGIS_USER: ${POSTGRES_USER:-municipal_gis}
      POSTGIS_PASSWORD: ${POSTGRES_PASSWORD:-municipal_gis_dev_password}
      # Task 7 GIS uploads — see docs/backend.md "GIS Uploads" / "File
      # storage". Configurable, never hard-coded in application code.
      GIS_UPLOAD_STORAGE_DIR: /app/storage/uploads
      GIS_UPLOAD_MAX_FILE_SIZE_MB: ${GIS_UPLOAD_MAX_FILE_SIZE_MB:-500}
      GIS_UPLOAD_MAX_EXTRACTED_ZIP_SIZE_MB: ${GIS_UPLOAD_MAX_EXTRACTED_ZIP_SIZE_MB:-2000}
      GIS_UPLOAD_MAX_ZIP_FILE_COUNT: ${GIS_UPLOAD_MAX_ZIP_FILE_COUNT:-100}
      # When "true", newly registered municipalities are seeded with the
      # three sample demo layers. Off by default — a fresh registration
      # starts with an empty layer list. See backend/.env.example.
      GIS_SEED_DEMO_LAYERS: ${GIS_SEED_DEMO_LAYERS:-false}
      # MapFish Print — Print Layout tool (docs/backend.md "Print Layout").
      # MAPFISH_PRINT_URL: this backend → the print engine.
      # MAPFISH_GEOSERVER_URL: the URL baked INTO the print spec, i.e. how
      # the mapfish-print container reaches GeoServer (compose-internal,
      # never the browser-facing localhost:8600).
      MAPFISH_PRINT_URL: ${MAPFISH_PRINT_URL:-http://mapfish-print:8080/print}
      MAPFISH_PRINT_APP: ${MAPFISH_PRINT_APP:-municipal-gis}
      MAPFISH_GEOSERVER_URL: ${MAPFISH_GEOSERVER_URL:-http://geoserver:8080/geoserver}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      # Keeps build output inside the container (not bind-mounted to the
      # host): the container runs as root, and `nest start --watch` writes
      # to dist/ on every reload — without this, those files would end up
      # root-owned on the host and block later host-side `npm run build`.
      - backend-dist:/app/dist
      # Same reasoning as backend-dist: uploaded/extracted GIS files are
      # written by the (root) container process — a named volume keeps
      # them out of the host-owned bind mount above, rather than leaving
      # root-owned files under ./backend/storage.
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      geoserver:
        condition: service_started
      # service_started, not healthy: a slow print engine must not block
      # the backend from booting. Print calls return 503 until it is up.
      mapfish-print:
        condition: service_started
      # Same reasoning: the AI service warms an embedding model on boot;
      # the backend must not wait for it. AI calls return 503 until it's up.
      gis-ai:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama-models:
  postgres-data:
  backend-node-modules:
  backend-dist:
  backend-storage:
  geoserver-data:
